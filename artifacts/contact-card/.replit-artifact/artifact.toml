kind = "web"
previewPath = "/"
title = "eBizCard"
description = "A shareable contact card designed for offline access, Home Screen use, QR scanning, and image saving."
version = "1.0.0"
id = "artifacts/contact-card"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24596

[services.development]
run = "pnpm --filter @workspace/contact-card run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/contact-card", "run", "build" ]
serve = "static"
publicDir = "artifacts/contact-card/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24596"
BASE_PATH = "/"
